# Cloudflare configuration of the Lone Hand game server (see README.md).
name = "lonehand"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan of Cloudflare Workers offers Durable Objects that keep their data in SQLite (this server keeps none).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
